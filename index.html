rder-actions"><a class="btn secondary" href="${wa(b)}" target="_blank" rel="noopener">TANYA ADMIN TENTANG BUKU INI</a></div></div></div></div></section>`}

<script>
const revisedBookDescriptions={
  tradisional:"Buku Menghidupkan Kembali Permainan Tradisional: Inovasi Pembelajaran PJOK Sekolah Dasar di Era Digital membahas bagaimana permainan tradisional dapat dihadirkan kembali sebagai sumber belajar yang relevan bagi anak masa kini. Permainan tradisional tidak hanya dipandang sebagai warisan budaya, tetapi juga sebagai ruang pengalaman gerak, interaksi sosial, kerja sama, sportivitas, kreativitas, dan pengenalan terhadap keragaman budaya. Dilengkapi dengan contoh penerapan dan gagasan praktis, buku ini diharapkan membantu guru PJOK, pendidik, dan praktisi menyesuaikan permainan dengan tujuan pembelajaran, karakteristik peserta didik, kondisi fasilitas sekolah, dan keragaman tradisi lokal.",
  simfoni:"Bagi anak-anak, dunia adalah panggung suara dan warna. Namun, seringkali pembelajaran PJOK terjebak dalam instruksi yang monoton. Simfoni Lapangan hadir untuk meruntuhkan dinding pemisah antara ketangkasan ﬁsik dan estetika nada. Melalui metode Harmonious Learning, Atmojo Prayogo Widodo membagikan \"partitur\" rahasia bagaimana musik mampu meluluhkan rasa takut murid terhadap bola, membangkitkan ritme lari yang konsisten, hingga mengubah pemanasan menjadi sebuah konser gerak yang penuh kegembiraan.",

};
